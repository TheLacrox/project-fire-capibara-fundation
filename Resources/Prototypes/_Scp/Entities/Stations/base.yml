- type: entity
  id: ScpComplexGoal
  abstract: true
  components:
  - type: StationGoal
    goals:
    - Scp1
    - Scp2
    - Scp3
    - Scp4
    - Scp5
    - Scp6
    - Scp7
    - Scp8
    - Scp9
    - Scp10
    - Scp11
    - Scp12

- type: entity
  id: BaseStationRegionalAdministration
  abstract: true
  components:
  - type: StationCentComm
    station: AdminFaxBase
    gridName: grid-name-scp-command-offices
    shuttleWhitelist:
      components:
      - CentCommShuttle
      - ErtShuttle

- type: entity
  id: BaseComplexTransitHub
  abstract: true
  components:
  - type: StationTransitHub
    map: /Maps/_Scp/transithub.yml
    gridName: map-name-scp-transit-hub
    warpPointName: map-name-scp-transit-hub
    biomes:
    - Snow
