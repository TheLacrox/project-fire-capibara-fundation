- type: interaction
  id: FaceCheeksPull
  name: interaction-name-face-cheeks-pull
  category: Face
  icon: FaceCheeksPullIcon
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:BodyAreaTagCondition
    checkInitiator: false
    checkTarget: true
    categories: [ "cheeks", "mouth" ]
    requireExposed: true
  interactionMessages:
  - interaction-message-face-cheeks-pull-1
  - interaction-message-face-cheeks-pull-2
  - interaction-message-face-cheeks-pull-3
  cooldown: 1

- type: interaction
  id: FacePats
  name: interaction-name-face-pats
  category: Face
  icon: FacePatsIcon
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:BodyAreaTagCondition
    checkInitiator: false
    checkTarget: true
    categories: [ "face" ]
    requireExposed: true
  interactionMessages:
  - interaction-message-face-pats-1
  - interaction-message-face-pats-2
  - interaction-message-face-pats-3
  interactionSounds:
  - FacePatsSound
  cooldown: 3

- type: interaction
  id: FaceLickDoggyStyle
  name: interaction-name-face-lick-doggy-style
  category: Face
  icon: FaceLickDoggyStyleIcon
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:BodyAreaTagCondition
    checkInitiator: true
    checkTarget: false
    categories: [ "mouth" ]
    requireExposed: true
  - !type:BodyAreaTagCondition
    checkInitiator: false
    checkTarget: true
    categories: [ "face" ]
    requireExposed: true
  - !type:SpeciesCondition
    checkTarget: false
    checkInitiator: true
    allowedSpecies: [ Vulpkanin, Felinid ]
  interactionMessages:
  - interaction-message-face-lick-doggy-style-1
  - interaction-message-face-lick-doggy-style-2
  - interaction-message-face-lick-doggy-style-3
  interactionSounds:
  - FaceLickDoggyStyleSound1
  - FaceLickDoggyStyleSound2
  cooldown: 3
